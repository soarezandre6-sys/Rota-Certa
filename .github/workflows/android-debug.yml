name: Rota Certa Android Debug

on:
  push:
    branches: [build-1-rota-certa]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build debug APK
        run: gradle :app:assembleDebug -PMAPS_API_KEY=CI_PLACEHOLDER
      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-build-1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
