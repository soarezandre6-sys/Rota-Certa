name: Rota Certa Android Debug

on:
  push:
    branches: [build-7-rota-certa]
  workflow_dispatch:

concurrency:
  group: rota-certa-build7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK 36
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build debug APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          KEY="${MAPS_API_KEY:-CI_PLACEHOLDER}"
          gradle :app:assembleDebug -PMAPS_API_KEY="$KEY" --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-build-7-debug
          path: app/build/outputs/apk/debug/app-debug.apk
